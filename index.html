<!DOCTYPE html>
<html>
<head>
  <script src="https://sdk.mercadopago.com/js/v2"></script>
</head>
<body>
  <form id="form-checkout">
    <div id="form-checkout__cardNumber"></div>
    <div id="form-checkout__expirationDate"></div>
    <div id="form-checkout__securityCode"></div>
    <input type="text" id="form-checkout__cardholderName" placeholder="Nombre del titular" value="APRO">
    <input type="email" id="form-checkout__cardholderEmail" placeholder="Email" value="test@test.com">
    <button type="submit">Pagar $100</button>
  </form>

  <script>
    const mp = new MercadoPago('APP_USR-dd74ca72-1fea-433e-ac0b-9d712dd4930e'); // De "Pruebas > Credenciales de prueba"

    const bricksBuilder = mp.bricks();

    bricksBuilder.create('cardPayment', 'form-checkout', {
      initialization: {
        amount: 100.00,
      },
      callbacks: {
        onSubmit: ({ selectedPaymentMethod, formData }) => {
          // Aquí envías formData.token + otros datos a tu backend (simula con console o fetch a localhost)
          console.log('Token generado:', formData.token);
          // Ejemplo fetch a tu backend o directo Postman copy
          fetch('https://api.mercadopago.com/v1/orders', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer APP_USR-6663528584813218-021812-8ec51b88933aaeabea6d4251664bde74-3211917588',
              'X-Idempotency-Key': 'test-' + Date.now()
            },
            body: JSON.stringify({
              type: 'online',
              processing_mode: 'automatic',
              capture_mode: 'automatic_async',
              external_reference: 'PLAN-EMPRENDEDOR-TEST-BRICK',
              total_amount: '100.00',
              payer: { email: formData.payer.email },
              transactions: {
                payments: [{
                  amount: '100.00',
                  payment_method: {
                    id: selectedPaymentMethod.id,
                    type: 'credit_card',
                    token: formData.token,
                    installments: 1,
                    statement_descriptor: 'TuTiendaTest'
                  }
                }]
              }
            })
          }).then(res => res.json()).then(console.log).catch(console.error);
          return false; // Evita submit default
        },
        onError: (error) => console.error(error)
      }
    });
  </script>
</body>
</html>
