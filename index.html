<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mercado Pago Orders Test</title>
<script src="https://sdk.mercadopago.com/js/v2"></script>

<style>
body {
  font-family: Arial;
}

#form-checkout {
  max-width: 400px;
  margin: 40px auto;
  padding: 20px;
  border: 1px solid #ddd;
  border-radius: 8px;
}

div[id^="form-checkout__"] {
  margin-bottom: 15px;
}

input, button {
  width: 100%;
  padding: 12px;
}

button {
  background: #009EE3;
  color: white;
  border: none;
  cursor: pointer;
}

#error-message {
  margin-top: 10px;
  font-weight: bold;
}
</style>

</head>
<body>

<form id="form-checkout">

  <div id="form-checkout__cardNumber"></div>
  <div id="form-checkout__expirationDate"></div>
  <div id="form-checkout__securityCode"></div>

  <input
    type="text"
    id="form-checkout__cardholderName"
    placeholder="Titular"
    value="APRO"
  />

  <input
    type="email"
    id="form-checkout__cardholderEmail"
    placeholder="Email"
    value="test_user@test.com"
  />

  <button type="submit">
    Pagar $100 MXN
  </button>

  <div id="error-message"></div>

</form>

<script>

const PUBLIC_KEY = "APP_USR-dd74ca72-1fea-433e-ac0b-9d712dd4930e";

const ACCESS_TOKEN = "APP_USR-6663528584813218-021812-8ec51b88933aaeabea6d4251664bde74-3211917588";

const mp = new MercadoPago(PUBLIC_KEY);

const bricksBuilder = mp.bricks();

bricksBuilder.create("cardPayment", "form-checkout", {

  initialization: {
    amount: 100
  },

  callbacks: {

    onSubmit: async ({ selectedPaymentMethod, formData }) => {

      try {

        console.log("Token:", formData.token);

        const response = await fetch(
          "https://api.mercadopago.com/v1/orders",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${ACCESS_TOKEN}`,
              "X-Idempotency-Key": crypto.randomUUID()
            },

            body: JSON.stringify({

              type: "online",

              processing_mode: "automatic",

              total_amount: 100,

              external_reference: "TEST-FRONT-ORDER",

              payer: {
                email: formData.payer.email
              },

              transactions: {
                payments: [
                  {
                    amount: 100,

                    payment_method: {
                      id: selectedPaymentMethod.id,
                      token: formData.token,
                      installments: 1
                    }
                  }
                ]
              }

            })

          }
        );

        const result = await response.json();

        console.log(result);

        if (result.errors) {

          showError(result.errors[0].message);

        } else {

          showError(
            "Status: " +
            result.status +
            " | ID: " +
            result.id
          );

        }

      } catch (error) {

        console.error(error);

        showError(error.message);

      }

      return false;

    },

    onError: error => {

      console.error(error);

      showError(error.message);

    }

  }

});

function showError(msg) {

  document.getElementById("error-message").innerText = msg;

}

</script>

</body>
</html>
